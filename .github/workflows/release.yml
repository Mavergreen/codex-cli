name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Publish a packaging-only .N+1 even though this declared state is released"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the toolchain
        run: |
          clang --version
          xcodebuild -version

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      # A Renovate bump of UPSTREAM_VERSION alone fails here, naming the commit build/codex-revision needs,
      # before anything is built, signed or published.
      - name: The upstream pin is a stable release and its commit
        run: sh build/check-upstream-pin.sh --remote

      - name: Version + publish decision
        id: ver
        env:
          LOCAL_RELEASE: ${{ inputs.local_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mode=auto
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$LOCAL_RELEASE" = true ]; then mode=local; fi
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          pub=no
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            pub="$rel"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$mode" = local ] || [ "$rel" = yes ]; then
              pub=yes
            else
              digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
              answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full")"
              echo "release-needed: $answer"
              if [ "$answer" = PUBLISH ]; then
                pub=yes
                out="$(sh build/version.sh local)"
                full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
              fi
            fi
          fi
          printf '%s\n' "$full" > VERSION
          { echo "ver=$full"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$pub"

      # build-codex.sh fetches the pinned Mavergreen Rust and clang-22 pkgs, the pinned Codex commit
      # and OpenAI's rusty_v8 archive itself, and writes $BUILD_ROOT/codex-cross.
      - name: Cross-build Codex
        run: sh build/build-codex.sh cross

      # CODEX_CROSS_ONLY_MANIFEST: CI has no native build to compare with, so the cross manifest is checked
      # against the pins alone; the native-vs-cross comparison is an out-of-band check; nothing enforces it.
      - name: Configure, build the updater, then the compat guard
        run: |
          shipyard-cmake --preset cross -DCODEX_BUILD_UPDATER=ON -DCODEX_CROSS_ONLY_MANIFEST=ON
          shipyard-cmake --build --preset cross
          shipyard-ctest --preset cross

      - name: Locate the build
        run: |
          {
            echo "BUILD=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross"
            echo "CODEX_OUT=$(sh build/resolve-build-root.sh)/codex-cross"
          } >> "$GITHUB_ENV"

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Check the pinned ingredients
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      - name: Package the .pkg
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          pkg="$(sh packaging/build-pkg.sh "$BUILD/codex-cli-updater.app" "$CODEX_OUT" "$VER" "$BUILD/dist")"
          [ -f "$pkg" ] || { echo "::error::build-pkg.sh did not print a pkg path: $pkg"; exit 1; }
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: The package yields exactly the built Codex
        run: sh tests/package-test.sh "$PKG" "$CODEX_OUT"

      - name: Release notes
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product "Codex CLI" --min-os 10.9.5 --out "$BUILD/dist/RELEASE_NOTES.md"

      - name: Record the declared state in the notes
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$BUILD/dist/RELEASE_NOTES.md" --digest "$digest"

      - name: Unsigned stand-in feeds (never published)
        if: steps.ver.outputs.publish != 'yes'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$BUILD/dist" "$VER"

      - name: EdDSA-sign the .pkg + write codex-cli.xml
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product codex-cli --feed-dir "$BUILD/dist" \
            --channel-title "Codex CLI for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")" \
            --notes-file "$BUILD/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      - name: Artifact conformance
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$BUILD/dist" "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade on its line
        if: steps.ver.outputs.publish == 'yes'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$BUILD/dist/codex-cli.xml" --version "$VER"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: codex-cli
          path: ${{ env.BUILD }}/dist/*

  # The cross-built pkg, installed on a real Mac OS X 10.9 guest. Non-voice and logged out: no
  # secrets reach this job but the VM image key.
  on-mavericks:
    needs: [build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: codex-cli
          path: dist
      - uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          debug-on-error: true
          run: |
            sw_vers
            pkg="$(ls dist/codex-cli-*.pkg | head -n 1)"
            sudo installer -pkg "$pkg" -target /
            bin=/usr/local/mavergreen/codex-cli/bin
            "$bin/codex" --version
            "$bin/codex" --help >/dev/null
            "$bin/codex-code-mode-host" --help >/dev/null
            # the link farm exports codex alone; --version only proves the symlinked codex starts (it never looks for the host)
            /usr/local/mavergreen/bin/codex --version
            [ ! -e /usr/local/mavergreen/bin/codex-code-mode-host ] || { echo "the host must not be exported"; exit 1; }
            "$bin/codex" sandbox -- /usr/bin/true

  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'yes')
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: codex-cli
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan, on-mavericks]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: codex-cli
