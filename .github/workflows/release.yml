name: release

# The pkg stream: the launcher, the installer and the Sparkle updater, versioned YYYYMMDD.N. It
# carries no Codex binary; builds.yml publishes those to the codex-builds channel. Only a dispatch
# publishes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Publish a packaging-only .N+1 even though this declared state is released"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # publish does not need on-mavericks while INGREDIENTS.md's on-target deviation stands;
      # this fails once mavericks-vm@v1 no longer warrants it
      - name: The on-target deviation still has its reason
        run: sh build/check-on-target-exit.sh

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the toolchain
        run: |
          clang --version
          xcodebuild -version

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      # CMake reads VERSION for the updater, so it is written before configuring.
      - name: Version (YYYYMMDD.N) + publish decision
        id: ver
        env:
          LOCAL_RELEASE: ${{ inputs.local_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          maxn=0
          for t in $(git tag --list "$base.*"); do
            n="${t##*.}"
            case "$n" in ''|*[!0-9]*) : ;; *) [ "$n" -gt "$maxn" ] && maxn="$n" ;; esac
          done
          ver="$base.$((maxn + 1))"
          pub=no
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$LOCAL_RELEASE" = true ]; then
              pub=yes
            else
              digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
              answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$ver")"
              echo "release-needed: $answer"
              if [ "$answer" = PUBLISH ]; then pub=yes; fi
            fi
          fi
          printf '%s\n' "$ver" > VERSION
          { echo "ver=$ver"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver publish=$pub"

      # The launcher refuses to run without an AquaTransport release that has the fixes Codex needs. While
      # the pin says "unreleased" no such release exists, so a publish stops here, before anything builds;
      # every other run only checks that the pin is well formed (on-mavericks still fails, saying why).
      - name: AquaTransport pin
        env:
          PUBLISH: ${{ steps.ver.outputs.publish }}
        run: |
          set -eu
          if [ "$PUBLISH" = yes ]; then
            sh build/check-aquatransport-pin.sh
          else
            sh build/check-aquatransport-pin.sh --allow-unreleased
          fi

      # on-mavericks refuses a pkg while the channel names no build, or every first run would fail;
      # while publish does not need on-mavericks, a publishing run refuses here instead
      - name: The channel names a build
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          url=https://github.com/Mavergreen/codex-cli/releases/download/codex-builds/latest.json
          want="$(curl -fsSL --connect-timeout 20 --max-time 60 "$url" | sed -n 's/.*"mavergreen_build":"\([^"]*\)".*/\1/p')" || want=""
          [ -n "$want" ] || { echo "::error::the codex-builds channel names no build at $url: publish a build before a pkg"; exit 1; }
          echo "the channel's build is $want"

      # The pkg carries no Codex binary, so no Codex is built here and CMake registers no Codex guard
      # tests; the updater, the one compiled thing, is guarded as it is built.
      - name: Configure (cross, pinned 10.9 SDK, with the updater)
        run: shipyard-cmake --preset cross -DCODEX_BUILD_UPDATER=ON

      - name: Build + compat guard
        run: shipyard-cmake --build --preset cross

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Locate the build
        run: echo "BUILD=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"

      - name: Package the .pkg
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          pkg="$(sh packaging/build-pkg.sh "$BUILD/codex-cli-updater.app" "$VER" "$BUILD/dist")"
          [ -f "$pkg" ] || { echo "::error::build-pkg.sh did not print a pkg path: $pkg"; exit 1; }
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: The package carries the launcher, the installer and the updater, and no Codex
        run: sh tests/package-test.sh "$PKG"

      # the README's one-liner fetches it from the latest release, beside the pkg it installs
      - name: The one-line installer
        run: cp packaging/install.sh "$BUILD/dist/install.sh"

      - name: Release notes
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product "Codex CLI" --min-os 10.9.5 --out "$BUILD/dist/RELEASE_NOTES.md"

      - name: Record the declared state in the notes
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$BUILD/dist/RELEASE_NOTES.md" --digest "$digest"

      - name: Unsigned stand-in feeds (never published)
        if: steps.ver.outputs.publish != 'yes'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$BUILD/dist" "$VER"

      - name: EdDSA-sign the .pkg + write codex-cli.xml
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product codex-cli --feed-dir "$BUILD/dist" \
            --channel-title "Codex CLI for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")" \
            --notes-file "$BUILD/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      - name: Artifact conformance
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$BUILD/dist" "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade on its line
        if: steps.ver.outputs.publish == 'yes'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$BUILD/dist/codex-cli.xml" \
            --version "$VER" --tag-glob '[0-9]*.[0-9]*'

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: codex-cli
          path: ${{ env.BUILD }}/dist/*

  # The pkg, installed on a real Mac OS X 10.9 guest with the products it requires, runs Codex
  # through the launcher from the published codex-builds channel, as a user's first run does. With
  # no build on the channel this fails, so no pkg publishes before the first build. Logged out: no
  # secrets reach this job but the VM image key.
  on-mavericks:
    needs: [build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pkg carries this pin, and its launcher refuses every command while it says
      # "unreleased", so the guest would fail deep in the run. Say why here instead.
      - name: The AquaTransport pin is set
        run: |
          set -eu
          if [ "$(tr -d '[:space:]' < components/aquatransport/min-version)" = unreleased ]; then
            echo "::error::AquaTransport pin is unreleased; set it when the fixed AquaTransport ships (components/aquatransport/min-version and tree/share/codex-cli/aquatransport-min-version)"
            exit 1
          fi
          sh build/check-aquatransport-pin.sh
      - uses: actions/download-artifact@v8
        with:
          name: codex-cli
          path: dist
      - name: Fetch the pinned rg and ed25519 packages codex-cli requires
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for p in rg ed25519; do sh build/fetch-required-pkg.sh "$p" deps; done
      - uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          debug-on-error: true
          run: |
            set -eu
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            set -- dist/codex-cli-*.pkg
            [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one codex-cli .pkg in the artifact, found: $*"; exit 1; }
            for p in deps/rg/*.pkg deps/ed25519/*.pkg "$1"; do sudo /usr/sbin/installer -pkg "$p" -target /; done
            pkgutil --pkg-info Wowfunhappy.AquaTransport >/dev/null 2>&1 || { echo "the guest image has no Wowfunhappy.AquaTransport package, which the launcher requires; the Mavericks VM image must carry it"; exit 1; }
            aq="$(pkgutil --pkg-info Wowfunhappy.AquaTransport | sed -n 's/^version: *//p')"
            aqmin="$(tr -d '[:space:]' < components/aquatransport/min-version)"
            echo "the guest has AquaTransport $aq; the package needs $aqmin or newer"
            [ "$(printf %s "$aq" | tr -d .)" -ge "$(printf %s "$aqmin" | tr -d .)" ] || { echo "the guest's AquaTransport $aq is older than the pin $aqmin: the Mavericks VM image (Mavergreen/mavericks-vm) must carry at least the pinned release"; exit 1; }
            url=https://github.com/Mavergreen/codex-cli/releases/download/codex-builds/latest.json
            want="$(/usr/bin/curl -fsSL --connect-timeout 20 --max-time 60 "$url" | sed -n 's/.*"mavergreen_build":"\([^"]*\)".*/\1/p')"
            [ -n "$want" ] || { echo "the codex-builds channel names no build at $url: publish a build before a pkg"; exit 1; }
            std="$HOME/.codex/packages/standalone"
            codex=/usr/local/mavergreen/bin/codex
            # the first run seeds the standalone install from the published channel
            v="$("$codex" --version)"
            [ "$v" = "codex-cli ${want%-mavericks.*}" ] || { echo "codex --version printed '$v', not 'codex-cli ${want%-mavericks.*}'"; exit 1; }
            cur="$(basename "$(readlink "$std/current")")"
            [ "$cur" = "$want-x86_64-apple-darwin" ] || { echo "the current release is '$cur', not $want"; exit 1; }
            "$codex" --help >/dev/null
            "$std/current/bin/codex-code-mode-host" --help >/dev/null
            [ ! -e /usr/local/mavergreen/bin/codex-code-mode-host ] || { echo "the host must not be exported"; exit 1; }
            "$codex" sandbox -- /usr/bin/true

  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'yes')
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: codex-cli
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # publish-release.yml creates the release with GitHub's default, so the pkg becomes the repo's
  # Latest; the codex-builds release is created with --latest=false and never takes it.
  publish:
    # not on-mavericks, while INGREDIENTS.md's on-target deviation stands
    needs: [build, scan]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: codex-cli
